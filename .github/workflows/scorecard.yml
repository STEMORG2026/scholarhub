name: Scorecard

# WHY THIS EXISTS
# Every claim about this repository's supply-chain posture is currently self-reported:
# `AGENTS.md` describes the protection, `ci.yml` describes the pinning, `SECURITY.md`
# describes the disclosure process. A reader has to take all of that on trust.
#
# OpenSSF Scorecard is the same set of questions answered by a third party, from the
# outside, on a public and citable score — branch protection, token permissions, pinned
# dependencies, dangerous workflow patterns, whether releases are signed, and whether the
# project is maintained. It is the artifact someone else's auditor asks for.
#
# NOT A REQUIRED CHECK, for the same reason as CodeQL: `verify` is the merge gate, and a
# scanner that decides whether a change is correct would be a second gate with a
# different definition of green.

on:
  # Re-score when protection changes, so the result tracks the thing it measures.
  branch_protection_rule:
  schedule:
    - cron: '20 7 * * 1'
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Upload the SARIF result to the code-scanning tab.
      security-events: write
      # publish_results signs the result with this OIDC token. Without it the run can
      # only report locally and the public scorecard is never updated — which would make
      # this a self-report again, the thing it exists to avoid.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        # ossf/scorecard-action publishes no floating `v2` tag — only exact versions — so
        # this is pinned to v2.4.4's commit rather than a moving major.
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to the code-scanning tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
